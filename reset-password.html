<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#eef5f9;
}



nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 70px;
background:white;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.logo{
display:flex;
align-items:center;
gap:10px;
}

.logo img{
width:60px;
height:60px;
border-radius:50%;
border:3px solid #1565c0;
object-fit:cover;
}

.logo h2{
color:#1565c0;
font-size:22px;
}

nav ul{
display:flex;
list-style:none;
gap:30px;
}

nav ul li a{
text-decoration:none;
color:#333;
font-weight:600;
}

nav ul li a:hover{
color:#1565c0;
}

/* Container */

.container{
display:flex;
justify-content:center;
align-items:center;
height:85vh;
}

.card{

width:430px;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.15);

}

.card h2{

text-align:center;
color:#1565c0;
margin-bottom:15px;

}

.card p{

text-align:center;
color:#666;
margin-bottom:25px;

}

.form-group{

margin-bottom:20px;

}

.form-group label{

display:block;
margin-bottom:8px;
font-weight:600;

}

.input-box{

display:flex;
align-items:center;
border:2px solid #ddd;
border-radius:8px;
padding:0 12px;

}

.input-box:focus-within{

border-color:#1565c0;

}

.input-box i{

color:#1565c0;
margin-right:10px;

}

.input-box input{

width:100%;
padding:13px;
border:none;
outline:none;
font-size:16px;

}

button{

width:100%;
padding:13px;
background:#2e7d32;
border:none;
color:white;
font-size:17px;
border-radius:8px;
cursor:pointer;
transition:.3s;

}

button:hover{

background:#1b5e20;

}

footer{

background:#1565c0;
color:white;
text-align:center;
padding:15px;

}

</style>

</head>

<body>

<nav>

<div class="logo">

<img src="logo.jpeg">

<h2>Smart Nail Health Monitoring</h2>

</div>

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="about.html">About</a></li>

<li><a href="contact.html">Contact</a></li>

</ul>

</nav>

<div class="container">

<div class="card">

<h2>Create New Password</h2>

<p>

Your OTP has been verified successfully.

</p>

<form id="resetForm">

<div class="form-group">

<label>New Password</label>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="newPassword"
placeholder="Enter New Password"
required>

</div>

</div>

<div class="form-group">

<label>Confirm Password</label>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

</div>

</div>

<button type="submit">

Update Password

</button>

</form>

</div>

</div>

<footer>

© 2026 Smart Nail Health Monitoring System

</footer>

<script>

document.getElementById("resetForm")
.addEventListener("submit",function(e){

e.preventDefault();

let pass=
document.getElementById("newPassword").value.trim();

let confirm=
document.getElementById("confirmPassword").value.trim();

if(pass==""){

alert("Please enter new password");

return;

}

if(pass.length<6){

alert("Password must contain at least 6 characters");

return;

}

if(confirm==""){

alert("Please confirm password");

return;

}

if(pass!==confirm){

alert("Passwords do not match");

return;

}

// Backend API will update password here

alert("Password Changed Successfully");

window.location.href="login.html";

});

</script>

</body>

</html>
