<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#eef5f9;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 70px;
background:white;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.logo{
display:flex;
align-items:center;
gap:10px;
}

.logo img{
width:60px;
height:60px;
border-radius:50%;
border:3px solid #1565c0;
object-fit:cover;
}

.logo h2{
color:#1565c0;
}

nav ul{
display:flex;
list-style:none;
gap:30px;
}

nav ul li a{
text-decoration:none;
color:#333;
font-weight:600;
}

nav ul li a:hover{
color:#1565c0;
}

.container{
display:flex;
justify-content:center;
align-items:center;
height:85vh;
}

.card{

width:420px;

background:white;

padding:35px;

border-radius:15px;

box-shadow:0 10px 25px rgba(0,0,0,.15);

}

.card h2{

text-align:center;

color:#1565c0;

margin-bottom:15px;

}

.card p{

text-align:center;

margin-bottom:25px;

color:#666;

}

.input-box{

display:flex;

align-items:center;

border:2px solid #ddd;

border-radius:8px;

padding:0 12px;

margin-bottom:20px;

}

.input-box i{

color:#1565c0;

margin-right:10px;

}

.input-box input{

width:100%;

padding:13px;

border:none;

outline:none;

font-size:16px;

}

button{

width:100%;

padding:13px;

border:none;

background:#2e7d32;

color:white;

font-size:17px;

border-radius:8px;

cursor:pointer;

}

button:hover{

background:#1b5e20;

}

.back{

text-align:center;

margin-top:20px;

}

.back a{

text-decoration:none;

color:#1565c0;

font-weight:bold;

}

footer{

background:#1565c0;

color:white;

text-align:center;

padding:15px;

}

</style>

</head>

<body>

<nav>

<div class="logo">

<img src="logo.jpeg">

<h2>Smart Nail Health Monitoring</h2>
</div>

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="about.html">About</a></li>

<li><a href="contact.html">Contact</a></li>

</ul>

</nav>

<div class="container">

<div class="card">

<h2>Forgot Password</h2>

<p>

Enter your registered email address.

</p>

<form id="forgotForm">

<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Enter Email Address"
required>

</div>

<button type="submit">

Send OTP

</button>

<div class="back">

<a href="login.html">

Back to Login

</a>

</div>

</form>

</div>

</div>

<footer>

© 2026 Smart Nail Health Monitoring System

</footer>

<script>

document.getElementById("forgotForm")
.addEventListener("submit",function(e){

e.preventDefault();

let email=
document.getElementById("email").value.trim();

const pattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

if(email==""){

alert("Please enter Email");

return;

}

if(!pattern.test(email)){

alert("Enter valid Email");

return;

}

// Backend API will be called here later

alert("OTP sent successfully.");

window.location.href="verify-otp.html";

});

</script>

</body>

</html>
