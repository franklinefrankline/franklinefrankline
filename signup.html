<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Smart Nail Health Monitoring System</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
min-height:100vh;
background:linear-gradient(135deg,#2193b0,#6dd5ed);
}
nav{
display:flex;justify-content:space-between;align-items:center;
padding:15px 60px;background:#fff;
box-shadow:0 2px 10px rgba(0,0,0,.2)
}
nav ul{display:flex;list-style:none;gap:30px}
nav a{text-decoration:none;color:#333;font-weight:bold}
nav a:hover{color:#0096C7}
.container{
display:flex;justify-content:center;align-items:center;
padding:50px 20px;
}
.signup-box{
width:430px;background:#fff;border-radius:20px;
padding:35px;box-shadow:0 12px 30px rgba(0,0,0,.25)
}
.signup-box h2{
text-align:center;color:#0096C7;margin-bottom:25px
}
.form-group{margin-bottom:18px}
.form-group label{
display:block;margin-bottom:8px;font-weight:bold
}
.input-box{
display:flex;align-items:center;
border:2px solid #ddd;border-radius:10px;
padding:0 12px;transition:.3s
}
.input-box:focus-within{
border-color:#0096C7;
box-shadow:0 0 8px rgba(0,150,199,.3)
}
.input-box i{color:#0096C7}
.input-box input{
flex:1;border:none;outline:none;
padding:12px;font-size:16px
}
button{
width:100%;padding:13px;border:none;
border-radius:10px;background:#0096C7;
color:#fff;font-size:17px;cursor:pointer;
transition:.3s
}
button:hover{background:#0077B6}
p{text-align:center;margin-top:20px}
p a{text-decoration:none;color:#0096C7;font-weight:bold}
p a:hover{text-decoration:underline}
@media(max-width:600px){
nav{flex-direction:column;gap:15px;padding:20px}
.signup-box{width:100%}
}
.logo img{
    width: 60px;
    height: 60px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #1565c0;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
</style>
</head>
<body>

<nav>
<div class="logo">
    <img src="logo.jpeg" alt="Smart Nail Health Logo">
    <h2>Smart Nail Health Monitoring</h2>
</div>
<ul>
<li><a href="index.html">Home</a></li>
<li><a href="about.html">About</a></li>
<li><a href="contact.html">Contact</a></li>
</ul>
</nav>

<div class="container">
<div class="signup-box">
<h2>Create Account</h2>

<form id="signupForm">

<div class="form-group">
<label>First Name</label>
<div class="input-box">
<i class="fa-solid fa-user"></i>
<input type="text" id="fname" placeholder="Enter First Name">
</div>

</div>

<div class="form-group">
<label>Last Name</label>
<div class="input-box">
<i class="fa-solid fa-user"></i>
<input type="text" id="lname" placeholder="Enter Last Name">
</div>
</div>

<div class="form-group">
<label>Email</label>
<div class="input-box">
<i class="fa-solid fa-envelope"></i>
<input type="email" id="email" placeholder="Enter Email">
</div>
</div>

<div class="form-group">
<label>Phone Number</label>
<div class="input-box">
<i class="fa-solid fa-phone"></i>
<input type="text" id="phone" placeholder="Enter Mobile Number">
</div>
</div>

<div class="form-group">
<label>Password</label>
<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input type="password" id="password" placeholder="Enter Password">
</div>
</div>

<button type="submit">Create Account</button>

<p>Already have an account?
<a href="login.html">Login</a>
</p>

</form>

</div>
</div>

<script>
document.getElementById("signupForm").addEventListener("submit",function(e){
e.preventDefault();

let fname=document.getElementById("fname").value.trim();
let lname=document.getElementById("lname").value.trim();
let email=document.getElementById("email").value.trim();
let phone=document.getElementById("phone").value.trim();
let password=document.getElementById("password").value.trim();

if(fname===""){alert("Please enter First Name");return;}
if(lname===""){alert("Please enter Last Name");return;}

const emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
if(email===""){alert("Please enter Email");return;}
if(!emailPattern.test(email)){alert("Please enter a valid Email");return;}

if(phone===""){alert("Please enter Mobile Number");return;}
if(!/^[0-9]{10}$/.test(phone)){
alert("Enter a valid 10-digit Mobile Number");
return;
}

if(password===""){alert("Please enter Password");return;}
if(password.length<6){
alert("Password must contain at least 6 characters");
return;
}

alert("Account Created Successfully!");
window.location.href="login.html";
});
</script>

</body>
</html>
