<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Login - Smart Nail Health Monitoring System</title>

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
/* =======================
   GLOBAL
======================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#eef5f9;
    min-height:100vh;
}

/* =======================
   NAVIGATION
======================= */

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 70px;
    background:#ffffff;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo img{
    width:60px;
    height:60px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #1976d2;
}

.logo h2{
    color:#1565c0;
    font-size:24px;
}

nav ul{
    display:flex;
    list-style:none;
    gap:30px;
}

nav ul li a{
    text-decoration:none;
    color:#333;
    font-size:17px;
    font-weight:600;
    transition:.3s;
}

nav ul li a:hover{
    color:#1976d2;
}

.signup-btn{
    text-decoration:none;
    background:#2e7d32;
    color:white;
    padding:10px 22px;
    border-radius:6px;
    transition:.3s;
}

.signup-btn:hover{
    background:#1b5e20;
}

/* =======================
   LOGIN SECTION
======================= */

.container{
    width:90%;
    margin:60px auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:50px;
}

/* Login Box */

.login-box{
    width:420px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.login-box h2{
    text-align:center;
    color:#1565c0;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

/* Form */

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#333;
}

.input-box{
    display:flex;
    align-items:center;
    border:2px solid #ddd;
    border-radius:8px;
    padding:0 12px;
    transition:.3s;
}

.input-box:focus-within{
    border-color:#1976d2;
    box-shadow:0 0 10px rgba(25,118,210,.2);
}

.input-box i{
    color:#1976d2;
    margin-right:10px;
}

.input-box input{
    width:100%;
    padding:13px;
    border:none;
    outline:none;
    font-size:16px;
}

/* Remember */

.remember{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    font-size:14px;
}

.remember a{
    text-decoration:none;
    color:#1565c0;
}

.remember a:hover{
    text-decoration:underline;
}

/* Button */

.login-btn{
    width:100%;
    padding:14px;
    background:#1976d2;
    color:white;
    border:none;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

.login-btn:hover{
    background:#0d47a1;
}

/* Register */

.register{
    text-align:center;
    margin-top:20px;
    color:#555;
}

.register a{
    text-decoration:none;
    color:#1976d2;
    font-weight:bold;
}

.register a:hover{
    text-decoration:underline;
}

/* =======================
   RIGHT IMAGE
======================= */

.login-image{
    flex:1;
    text-align:center;
}

.login-image img{
    width:450px;
    max-width:100%;
}

/* =======================
   FOOTER
======================= */

footer{
    background:#1565c0;
    color:white;
    text-align:center;
    padding:18px;
    margin-top:50px;
}

/* =======================
   RESPONSIVE
======================= */

@media(max-width:900px){

.container{
    flex-direction:column;
}

.login-box{
    width:100%;
    max-width:450px;
}

.login-image img{
    width:320px;
}

nav{
    flex-direction:column;
    gap:20px;
}

nav ul{
    gap:20px;
}

}

@media(max-width:600px){

nav{
    padding:20px;
}

.logo h2{
    font-size:18px;
}

nav ul{
    flex-wrap:wrap;
    justify-content:center;
}

.login-box{
    padding:25px;
}

}
</style>

</head>
<body>

    <!-- ================= NAVIGATION ================= -->

    <nav>

        <div class="logo">

            <img src="logo.jpeg" alt="Logo">

            <h2>Smart Nail Health Monitoring</h2>

        </div>

        <ul>

            <li><a href="index.html">Home</a></li>

            <li><a href="about.html">About</a></li>

            <li><a href="contact.html">Contact</a></li>

        </ul>

        <a href="signup.html" class="signup-btn">
            Sign Up
        </a>

    </nav>

    <!-- ================= LOGIN ================= -->

    <section class="container">

        <div class="login-box">

            <h2>Welcome Back</h2>

            <p class="subtitle">
                Login to access your Smart Nail Health Dashboard
            </p>

            <form id="loginForm">

                <!-- Email -->

                <div class="form-group">

                    <label>Email Address</label>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required>

                    </div>

                </div>

                <!-- Password -->

                <div class="form-group">

                    <label>Password</label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required>

                    </div>

                </div>

                <!-- Remember -->

                <div class="remember">

                    <label>

                        <input type="checkbox">

                        Remember Me

                    </label>

                    <a href="forgot.html">Forgot Password?</a>

                </div>

                <!-- Button -->

                <button
                    type="submit"
                    class="login-btn">

                    Login

                </button>

            </form>

            <p class="register">

                Don't have an account?

                <a href="signup.html">

                    Create Account

                </a>

            </p>

        </div>

        <!-- Right Side -->

        <div class="login-image">

            <img src="login.png" alt="Login Image">

        </div>

    </section>

    <!-- ================= FOOTER ================= -->

    <footer>

        <p>

            © 2026 Smart Nail Health Monitoring System

            | Developed by Frankline

        </p>

    </footer>

    <!-- JavaScript -->

  



<script>

document.addEventListener("DOMContentLoaded", () => {

    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", function (event) {

        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        // Email Validation
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (email === "") {
            alert("Please enter your Email Address.");
            return;
        }

        if (!emailPattern.test(email)) {
            alert("Please enter a valid Email Address.");
            return;
        }

        // Password Validation
        if (password === "") {
            alert("Please enter your Password.");
            return;
        }

        if (password.length < 6) {
            alert("Password must contain at least 6 characters.");
            return;
        }

        // Login Success
        alert("Login Successful!");

        // Redirect to Dashboard
        window.location.href = "dashboard.html";

    });

});

</script>

</body>
</html>
